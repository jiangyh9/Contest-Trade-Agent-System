# 支持的变量名：TUSHARE_KEY, BOCHA_KEY, SERP_KEY, FMP_KEY, FINNHUB_KEY, ALPHA_VANTAGE_KEY, POLYGON_KEY
# LLM: LLM_API_KEY / LLM_THINKING_API_KEY / VLM_API_KEY / OPENAI_API_KEY

#YOUR_TUSHARE_KEY
tushare_key: "" 

#YOUR_BOCHA_KEY
bocha_key: "" 

#YOUR_SERP_KEY
serp_key: "" 

#YOUR_FMP_KEY
fmp_key: ""

#YOUR_FINNHUB_KEY
finnhub_key: "" 

#YOUR_ALPHA_VANTAGE_KEY
alpha_vantage_key: ""

# YOUR_POLYGON_KEY
polygon_key: ""

llm:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: "" #YOUR_DEEPSEEK_API_KEY
  model_name: "deepseek-v4-pro"

llm_thinking:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: "" #YOUR_DEEPSEEK_API_KEY
  model_name: "deepseek-v4-pro"

vlm:
  provider: "openai"
  # 阿里云百炼 Qwen，使用 OpenAI 兼容 Completions API
  base_url: "https://llm-bzrmi4xxc3ili1bf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  api_key: "" # 从 VLM_API_KEY 或 DASHSCOPE_API_KEY 环境变量读取
  model_name: "qwen3.8-max"

# US Market specific data agents configuration
data_agents_config:
  - agent_name: "us_polygon_news"
    data_source_list: 
      - "data_source.us_polygon_news.USPolygonNews"
  - agent_name: "us_price_market"
    data_source_list: 
      - "data_source.us_price_market.USPriceMarket"

# US Market specific research agent configuration  
research_agent_config:
  belief_list_path: "config/belief_list.json"
  max_react_step: 10
  output_language: "English"
  tools:
    - "tools.stock_symbol_search_us.stock_symbol_search"
    - "tools.corp_info_us.company_financial_info"
    - "tools.price_info_us.price_info"
    - "tools.search_web.search_web"
    - "tools.stock_summary_us.stock_summary"
    - "tools.final_report.final_report"

market_config_file: "config/market_config_us.yaml"

system_language: "English"

# 数据层淘汰赛配置（已禁用：Data Agent 只做数据聚合，不参与淘汰）
data_contest_config:
  enabled: False
  mode: "knockout"
  history_window_days: 5
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 1
  eliminated_revival_interval: 1

# 研究层淘汰赛配置
researcher_contest_config:
  enabled: True
  mode: "knockout"
  judger_config: llm
  num_judgers: 3
  window_m: 3
  window_n: 3
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  # interval=1 表示每层 agent 每轮都运行，仅按表现打 tier 标签
  bench_revival_interval: 1
  eliminated_revival_interval: 1
  fallback_to_judge: True
  # 不同风险画像的持仓天数（用于计算 forward return 和淘汰）
  holding_period_by_risk_profile:
    激进套利者: 1
    风险偏好者: 1
    稳健投资者: 5
    防御套利者: 3