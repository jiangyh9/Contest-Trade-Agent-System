# US Market specific data agents configuration
# A：大盘/板块轮动因子
# B：宏观/行业新闻因子
# C：财报/IPO 事件因子
# D：内幕交易 + 另类数据因子（游说/政府合同/专利）
# E：分析师情绪 + 机构持仓因子
data_agents_config:
  - agent_name: "us_price_market"
    data_source_list:
      - "data_source.us_price_market.USPriceMarket"
  - agent_name: "us_macro_news"
    data_source_list:
      - "data_source.us_macro_news.USMacroNews"
  - agent_name: "us_earnings_events"
    data_source_list:
      - "data_source.us_earnings_events.USEarningsEvents"
  - agent_name: "us_insider_alternative"
    data_source_list:
      - "data_source.us_insider_alternative.USInsiderAlternative"
  - agent_name: "us_analyst_sentiment"
    data_source_list:
      - "data_source.us_analyst_sentiment.USAnalystSentiment"

# US Market specific research agent configuration  
research_agent_config:
  belief_list_path: "config/belief_list.json"
  max_react_step: 10
  output_language: "English"
  tools:
    - "tools.stock_symbol_search_us.stock_symbol_search"
    - "tools.corp_info_us.company_financial_info"
    - "tools.price_info_us.price_info"
    - "tools.search_web.search_web"
    - "tools.stock_summary_us.stock_summary"
    - "tools.final_report.final_report"

market_config_file: "config/market_config_us.yaml"

system_language: "English"

# 数据层淘汰赛配置（已禁用：恢复为所有 Data Agent 并行运行，不淘汰/不打分）
data_contest_config:
  enabled: False
  mode: "knockout"
  history_window_days: 5
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 2
  eliminated_revival_interval: 5

# 研究层淘汰赛配置（已禁用：恢复为所有 Research Agent 并行运行，信号全部入报告）
researcher_contest_config:
  enabled: False
  mode: "knockout"
  judger_config: llm
  num_judgers: 3
  window_m: 3
  window_n: 3
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 2
  eliminated_revival_interval: 5
  fallback_to_judge: True
  # 不同风险画像的持仓天数（用于计算 forward return 和淘汰）
  holding_period_by_risk_profile:
    激进套利者: 1
    风险偏好者: 1
    稳健投资者: 5
    防御套利者: 3