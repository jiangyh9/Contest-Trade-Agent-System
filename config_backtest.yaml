# 敏感信息请通过环境变量注入，例如 export TUSHARE_KEY=xxx
# 支持的变量名：TUSHARE_KEY, BOCHA_KEY, SERP_KEY, FMP_KEY, FINNHUB_KEY
# LLM: LLM_API_KEY / LLM_THINKING_API_KEY / VLM_API_KEY / OPENAI_API_KEY

tushare_key: ""

bocha_key: ""
serp_key: ""

fmp_key: ""
finnhub_key: ""

llm:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: ""
  model_name: "deepseek-v4-pro"

llm_thinking:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: ""
  model_name: "deepseek-v4-pro"

vlm:
  provider: "openai"
  # 阿里云百炼 Qwen，使用 OpenAI 兼容 Completions API
  base_url: "https://llm-bzrmi4xxc3ili1bf.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  api_key: ""  # 从 VLM_API_KEY 或 DASHSCOPE_API_KEY 环境变量读取
  model_name: "qwen3.8-max"

# 回测专用：只使用支持历史 trigger_time 的 AKShare 数据源
# 数据源保证只读取 trigger_time 上一个交易日及之前的数据，无未来信息
data_agents_config:
  - agent_name: "akshare_news_agent"
    data_source_list: 
      - "data_source.akshare_news.AkshareNews"
  - agent_name: "price_market_agent"
    data_source_list: 
      - "data_source.price_market_akshare.PriceMarketAkshare"
  - agent_name: "hot_money_agent"
    data_source_list: 
      - "data_source.hot_money_akshare.HotMoneyAkshare"

research_agent_config:
  belief_list_path: "config/belief_list.json"
  max_react_step: 10
  output_language: "中文"
  # 回测禁用 web search，只使用可获取历史数据/本地数据的工具
  tools:
    - "tools.stock_symbol_search_akshare.stock_symbol_search"
    - "tools.stock_selector_akshare.stock_selector"
    - "tools.corp_info_akshare.company_financial_info"
    - "tools.price_info_akshare.price_info"
    - "tools.stock_summary_akshare.stock_summary"
    - "tools.final_report.final_report"

market_config_file: "config/market_config.yaml"

system_language: "中文"

# 回测专用淘汰赛配置（Data Agent 只聚合数据，不参与淘汰）
data_contest_config:
  enabled: False
  mode: "knockout"
  history_window_days: 5
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 1
  eliminated_revival_interval: 1

researcher_contest_config:
  enabled: True
  mode: "knockout"
  judger_config: llm
  num_judgers: 1
  window_m: 5
  window_n: 3
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  # interval=1 表示每层 agent 每轮都运行，仅按表现打 tier 标签
  bench_revival_interval: 1
  eliminated_revival_interval: 1
  fallback_to_judge: False
  holding_period_by_risk_profile:
    激进套利者: 1
    风险偏好者: 1
    稳健投资者: 5
    防御套利者: 3
