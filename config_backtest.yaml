tushare_key: "<EMPTY_KEY>"

bocha_key: ""
serp_key: ""

fmp_key: ""
finnhub_key: ""

llm:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: "<EMPTY_KEY>"
  model_name: "deepseek-pro"

llm_thinking:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: "<EMPTY_KEY>"
  model_name: "deepseek-pro"

vlm:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: "<EMPTY_KEY>"
  model_name: "deepseek-pro"

# 回测专用：只使用支持历史 trigger_time 的 Tushare/AKShare 数据源
data_agents_config:
  - agent_name: "thx_summary_agent"
    data_source_list: 
      - "data_source.thx_news.ThxNews"
  - agent_name: "sina_summary_agent"
    data_source_list: 
      - "data_source.sina_news.SinaNews"
  - agent_name: "price_market_agent"
    data_source_list: 
      - "data_source.price_market.PriceMarket"
  - agent_name: "hot_money_agent"
    data_source_list: 
      - "data_source.hot_money.HotMoney"

research_agent_config:
  belief_list_path: "config/belief_list.json"
  max_react_step: 10
  output_language: "中文"
  # 回测禁用 web search，只使用可获取历史数据/本地数据的工具
  tools:
    - "tools.stock_symbol_search_akshare.stock_symbol_search"
    - "tools.stock_selector_akshare.stock_selector"
    - "tools.corp_info_akshare.company_financial_info"
    - "tools.price_info_akshare.price_info"
    - "tools.stock_summary_akshare.stock_summary"
    - "tools.final_report.final_report"

market_config_file: "config/market_config.yaml"

system_language: "中文"

# 回测专用淘汰赛配置
data_contest_config:
  enabled: True
  mode: "knockout"
  history_window_days: 5
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 2
  eliminated_revival_interval: 5

researcher_contest_config:
  enabled: True
  mode: "knockout"
  judger_config: llm
  num_judgers: 1
  window_m: 5
  window_n: 3
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 2
  eliminated_revival_interval: 5
  fallback_to_judge: False
  holding_period_by_risk_profile:
    激进套利者: 1
    风险偏好者: 1
    稳健投资者: 5
    防御套利者: 3
