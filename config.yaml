system_language: "中文"

# 数据层淘汰赛配置（已禁用：Data Agent 只做数据聚合，不参与淘汰）
data_contest_config:
  enabled: False
  mode: "knockout"
  history_window_days: 5
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  bench_revival_interval: 1
  eliminated_revival_interval: 1

# 研究层淘汰赛配置（替代原 LightGBM 权重优化）
researcher_contest_config:
  enabled: True
  mode: "knockout"
  judger_config: llm
  num_judgers: 3
  window_m: 3
  window_n: 3
  champion_ratio: 0.30
  eliminated_ratio: 0.30
  # interval=1 表示每层 agent 每轮都运行，仅按表现打 tier 标签，不跳过任何 agent
  bench_revival_interval: 1
  eliminated_revival_interval: 1
  fallback_to_judge: True
  # 不同风险画像的持仓天数（用于计算 forward return 和淘汰）
  holding_period_by_risk_profile:
    激进套利者: 1
    风险偏好者: 1
    稳健投资者: 5
    防御套利者: 3
